<script>

    const requested=q.get('scenario')||q.get('flow');
    const selected=data.scenarios.find(s=>s.id===requested)||data.scenarios[0];
    scenarioId=selected?.id||'';
    const value=Number(q.get('step')); const legacyIndex=Number.isInteger(value)&&value>=0?value:0;
    const mapped=legacy?(selected?.legacyStages?.[legacyIndex]??0):legacyIndex;
    const section=q.get('section');
    current=section&&/^step-\d+$/.test(section)?Number(section.slice(5)):mapped;
    current=Math.max(0,Math.min(Math.max(0,(selected?.steps.length||0)-1),current));
    return legacy?null:section;
  }
  function messagesOf(step){return step.messages||[{from:step.from,to:step.to,label:step.name,kind:step.kind,entry:step.entry,shape:step.beforeShape,fields:step.before,evidence:step.evidence}];}
  function participantsOf(scenario){
    if(data.participants?.length)return data.participants;
    const names=[...new Set(scenario.steps.flatMap(s=>messagesOf(s).flatMap(m=>[m.from,m.to])))].filter(Boolean);
    return names.map(name=>({id:name,name,role:''}));
  }
  const ns='http://www.w3.org/2000/svg';
  const svgEl=(tag,attributes,text)=>{const el=document.createElementNS(ns,tag);Object.entries(attributes||{}).forEach(([k,v])=>el.setAttribute(k,String(v)));if(text!==undefined)el.textContent=text;return el;};
  function renderSequence(scenario){
    $('sequence-diagram').replaceChildren();
    const actors=participantsOf(scenario), width=Math.max(760,actors.length*155+80), columns=new Map(actors.map((a,i)=>[a.id,85+i*(width-170)/Math.max(1,actors.length-1)]));
    const total=scenario.steps.reduce((n,s)=>n+46+messagesOf(s).length*58,0)+112;
    const svg=svgEl('svg',{viewBox:'0 0 '+width+' '+total,role:'img','aria-label':scenario.name+'的参与者与交互时序'});
    svg.append(svgEl('title',{},scenario.name+'：箭头标出谁传给谁，编号对应案例'));
    const defs=svgEl('defs'), marker=svgEl('marker',{id:'sequence-arrow',viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(svgEl('path',{d:'M0 0L8 4L0 8Z',fill:'#98caff'}));defs.append(marker);svg.append(defs);
    actors.forEach(actor=>{const x=columns.get(actor.id);svg.append(svgEl('line',{x1:x,y1:70,x2:x,y2:total-20,class:'lifeline'}),svgEl('rect',{x:x-67,y:12,width:134,height:46,rx:6,fill:'#10283f',stroke:'#567d9f'}),svgEl('text',{x,y:31,'text-anchor':'middle',class:'sequence-label'},actor.name));const role=actor.role||'';svg.append(svgEl('text',{x,y:49,'text-anchor':'middle',class:'sequence-muted'},role.length>15?role.slice(0,15)+'…':role));});
    let y=86, number=0;
    scenario.steps.forEach((phase,index)=>{svg.append(svgEl('rect',{x:12,y,width:width-24,height:28,rx:4,class:'phase-band'+(index===current?' active':''),'data-phase':index}),svgEl('text',{x:26,y:y+19,class:'phase-title'},'阶段 '+(index+1)+' · '+phase.name));y+=46;
      messagesOf(phase).forEach(message=>{number++;const x1=columns.get(message.from),x2=columns.get(message.to),g=svgEl('g',{class:'message-link',role:'link',tabindex:0,'aria-label':'定位阶段'+(index+1)+'，'+(actors.find(a=>a.id===message.from)?.name||message.from)+'传给'+(actors.find(a=>a.id===message.to)?.name||message.to)});
        if(x1===undefined||x2===undefined){g.append(svgEl('text',{x:26,y,class:'sequence-label'},number+'. '+message.label+'（参与者未定义）'));}else{
          const self=x1===x2,d=self?'M'+x1+' '+y+'h40v24h-40':'M'+x1+' '+y+'L'+x2+' '+y;
          g.append(svgEl('path',{d,class:'sequence-line','marker-end':'url(#sequence-arrow)'}),svgEl('text',{x:self?x1+46:(x1+x2)/2,y:y-9,'text-anchor':self?'start':'middle',class:'sequence-label'},String(number).padStart(2,'0')+' · '+message.label));
        }
        g.onclick=()=>go(index);g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();go(index);}});svg.append(g);y+=58;
      });
    });$('sequence-diagram').append(svg);
  }
  function fieldView(values){
    const dl=make('dl',undefined,'fields');
    if(!values?.length){dl.append(make('p','本消息没有需要传入的业务字段，或字段细分来源未记录。','muted'));return dl;}
    values.forEach(field=>{const value=Array.isArray(field)?{name:field[0],meaning:field[1],source:field[2]}:field;const row=make('div',undefined,'field');row.append(make('dt',value.name));const dd=make('dd',value.meaning||'');dd.append(make('span','来源：'+(value.source||'细分来源未记录，不能补造。'),'origin'));row.append(dd);dl.append(row);});return dl;
  }
  function highlight(){
    document.querySelectorAll('[data-stage-link]').forEach(a=>{if(Number(a.dataset.stageLink)===current)a.setAttribute('aria-current','step');else a.removeAttribute('aria-current');});
    document.querySelectorAll('.phase-card').forEach((card,index)=>card.dataset.current=String(index===current));
    document.querySelectorAll('[data-phase]').forEach(el=>el.classList.toggle('active',Number(el.dataset.phase)===current));
    const length=data.scenarios.find(s=>s.id===scenarioId)?.steps.length||0;$('previous-stage').disabled=current===0;$('next-stage').disabled=current>=length-1;
  }
  function go(index){
    const scenario=data.scenarios.find(s=>s.id===scenarioId);if(!scenario?.steps.length)return;
    current=Math.max(0,Math.min(scenario.steps.length-1,index));highlight();try{history.replaceState(null,'','#'+new URLSearchParams({scenario:scenarioId,section:'step-'+current}));}catch{}
    const target=$('step-'+current);target?.scrollIntoView({block:'start'});target?.focus({preventScroll:true});
  }
  function render(){
    $('flow-content').replaceChildren();$('step-nav').replaceChildren();$('scenario-control').replaceChildren();
    const scenario=data.scenarios.find(s=>s.id===scenarioId);
    if(!scenario?.steps.length){$('sequence-diagram').replaceChildren();$('flow-content').append(make('p','当前证据没有可确认的流程步骤，暂未补造。'));$('story').textContent=scenario?.story||'缺少场景材料，不编造模拟案例。';highlight();return;}
    $('title').textContent=scenario.title||data.title;document.title=data.title;
    $('story').textContent=scenario.story||'当前仅有字段与处理说明；模拟输入和前后数据形状尚未记录，不能冒充实测。';
    if(data.scenarios.length>1){const select=make('select');select.id='scenario';select.setAttribute('aria-label','业务场景');data.scenarios.forEach(s=>{const option=make('option',s.name);option.value=s.id;select.append(option);});select.value=scenarioId;select.onchange=()=>{scenarioId=select.value;current=0;render();try{history.replaceState(null,'','#'+new URLSearchParams({scenario:scenarioId}));}catch{}};$('scenario-control').append(select);}else $('scenario-control').append(make('p',scenario.name,'muted'));
    const actors=participantsOf(scenario);let number=0;
    scenario.steps.forEach((phase,index)=>{
      const anchor=make('a',String(index+1).padStart(2,'0')+' · '+phase.name);anchor.href='#'+new URLSearchParams({scenario:scenarioId,section:'step-'+index});anchor.dataset.stageLink=index;$('step-nav').append(anchor);
      const article=make('article',undefined,'phase-card flow-step jump-target');article.id='step-'+index;article.tabIndex=-1;
      const head=make('div',undefined,'phase-head'),heading=make('div');heading.append(make('h3',(index+1)+'. '+phase.name),make('p',phase.summary||phase.change||''));head.append(make('span',String(index+1).padStart(2,'0'),'phase-number'),heading);article.append(head);
      messagesOf(phase).forEach(message=>{number++;const box=make('section',undefined,'message-card'),transfer=make('div',undefined,'transfer');
        const from=actors.find(a=>a.id===message.from)?.name||message.from||'发送方未知',to=actors.find(a=>a.id===message.to)?.name||message.to||'接收方未知';
        transfer.append(make('span',String(number).padStart(2,'0'),'message-index'),make('span',from,'actor'),make('span','→','muted'),make('span',to,'actor'),make('span',message.kind||'关系类型待确认','badge'));
        box.append(transfer,make('p',message.label,'message-name'),make('p',message.entry||'当前入口未记录','entry'));
        if(message.case===false){
          if(message.result)box.append(make('p',message.result,'muted'));
          box.classList.add('message-summary');article.append(box);return;
        }
        const payload=make('div',undefined,'payload'),example=make('div'),fields=make('div');
        example.append(make('h4','这次传的数据长这样 · 模拟结构'));
        if(message.shape!==undefined)example.append(make('pre',shapeText(message.shape)));else example.append(make('p','源码或契约未确认具体数据形状，当前不补造样例。','muted'));
        fields.append(make('h4','字段含义与来源'),fieldView(message.fields));payload.append(example,fields);box.append(payload);
        if(message.result){box.append(make('p','接收后：'+message.result,'boundary'));}
        if(message.evidence?.length)box.append(sourceList(message.evidence));article.append(box);
      });
      const processing=make('div',undefined,'processing');processing.append(make('h4','这一阶段在业务上做什么'),list(phase.processing||[]));
      if(!phase.processing?.length&&phase.change)processing.append(make('p',phase.change));article.append(processing);
      if(phase.result)article.append(make('p','阶段结果：'+phase.result,'phase-result'));
      if(phase.boundary)article.append(make('p',phase.boundary,'boundary'));
      if(phase.evidence?.length)article.append(sourceList(phase.evidence));
      $('flow-content').append(article);
    });renderSequence(scenario);highlight();
  }
  function moduleView(id,path){
    const node=nodes.get(id);if(!node)return [make('p','模块 '+id+' 缺少资料。','muted')];
    if(path.includes(id))return [make('p','此处引用 '+node.name+'，不重复展开循环关系。','muted')];
    const card=make('article',undefined,'module');card.append(make('h3',node.name),make('p',node.role));
    if(node.evidence?.length)card.append(make('p','负责位置：'+node.evidence[0],'module-place'));
    if(node.boundary)card.append(make('p',node.boundary,'boundary'));
    const result=[card];(node.children||[]).forEach(child=>result.push(...moduleView(child,[...path,id])));return result;
  }
  $('scope').textContent=data.scope;$('status').textContent=data.status;$('source-list').append(list(data.sources));$('module-content').append(...moduleView(data.root,[]));
  hashState();render();
  $('previous-stage').onclick=()=>go(current-1);$('next-stage').onclick=()=>go(current+1);
  function restoreLocation(){const previous=scenarioId,section=hashState();if(previous!==scenarioId)render();else highlight();if(section&&/^step-\d+$/.test(section))go(current);}
  window.addEventListener('hashchange',restoreLocation);window.addEventListener('load',restoreLocation,{once:true});restoreLocation();
})();
</script>
