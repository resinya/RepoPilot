name: repo-pilot
version: 0.1.0
description: >
  Declarative manifest for the repository-onboarding workflow. SKILL.md keeps the
  always-needed exploration stance small, while loading the onboarding playbook
  only when the request is about running the project or guiding a newcomer.

# Design note: every exploration needs the project-map protocol, because a wrong
# map poisons everything downstream. The onboarding path is only needed when the
# user wants to actually run or join the project — a question about one module
# should not load it.

always_load:
  - references/project-map-protocol.md

references:
  on_demand:
    - condition: the user wants to run the project locally, or needs a step-by-step onboarding path for a newcomer
      path: references/onboarding-path.md
